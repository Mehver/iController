name: Build For Release

on:
  release:
    types: [ created ]

jobs:
  update-version-number:
    needs:
      - build-windows-x64-cli
      - build-windows-x64-gui
    if: ${{ needs.build-windows-x64-cli.result == 'success' && needs.build-windows-x64-gui.result == 'success' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.10'

      - name: Find previous release tag
        id: prev_tag
        run: |
          $currentTag = "${{ github.event.release.tag_name }}"
          $previous = ""
          gh release list --limit 100 --json tagName --jq '.[].tagName' | ForEach-Object {
              if (-not $previous -and $_ -ne $currentTag) {
                  $previous = $_
              }
          }
          echo "value=$previous" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh

      - name: Update Version Number
        if: ${{ steps.prev_tag.outputs.value != '' }}
        run: |
          $previousTag = "${{ steps.prev_tag.outputs.value }}"
          $currentTag = "${{ github.event.release.tag_name }}"
          echo "OLD_VERSION=$previousTag" >> $env:GITHUB_ENV
          python .github/scripts/UpdateVersionNumber.py $previousTag $currentTag
        shell: pwsh

      - name: Commit Version Number Update to main
        if: ${{ steps.prev_tag.outputs.value != '' && success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 在当前 detached HEAD 下创建一个临时分支保存改动
          git checkout -b version-update-temp
          git add .
          git commit -m "Update version number from $env:OLD_VERSION to ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          # 切换到主分支，这里假设主分支名称为 main
          git fetch origin main
          git checkout main
          # 将临时分支的改动合并到主分支
          git merge version-update-temp --no-ff -m "Merge version update from $env:OLD_VERSION to ${{ github.event.release.tag_name }}"
          git push origin main
        shell: pwsh

      - name: Copy Previous Release Note if Current is Empty
        if: ${{ steps.prev_tag.outputs.value != '' && success() }}
        run: |
          $currentTag = "${{ github.event.release.tag_name }}"
          $previousTag = "${{ steps.prev_tag.outputs.value }}"

          $currentBody = (gh release view $currentTag --json body --jq '.body') -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to fetch current release body"
            exit 1
          }

          if (-not $currentBody -or $currentBody.Trim() -eq '' -or $currentBody -eq 'null') {
            Write-Host "Current release note is empty. Copying from $previousTag ..."

            $previousBody = (gh release view $previousTag --json body --jq '.body') -join "`n"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to fetch previous release body"
              exit 1
            }

            if ($previousBody -and $previousBody.Trim() -ne '' -and $previousBody -ne 'null') {
              $tempFile = New-TemporaryFile
              [System.IO.File]::WriteAllText($tempFile.FullName, $previousBody, [System.Text.UTF8Encoding]::new($false))

              python .github/scripts/CopyReleaseNote.py $previousTag $currentTag $tempFile.FullName
              if ($LASTEXITCODE -ne 0) {
                Remove-Item $tempFile.FullName -ErrorAction SilentlyContinue
                Write-Error "CopyReleaseNote.py failed"
                exit 1
              }

              gh release edit $currentTag --notes-file $tempFile.FullName
              Remove-Item $tempFile.FullName -ErrorAction SilentlyContinue

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Release note copied and version numbers updated successfully."
              } else {
                Write-Error "Failed to update release notes"
                exit 1
              }
            } else {
              Write-Host "Previous release note is also empty. Nothing to copy."
            }
          } else {
            Write-Host "Current release note is not empty. Skipping copy."
          }
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh

  build-windows-x64-cli:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: React Build Frontend
        working-directory: app/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.10'
          cache: 'pip'
          cache-dependency-path: app/backend/requirements/iControllerCLI.txt

      - name: Find previous release tag
        id: prev_tag
        run: |
          $currentTag = "${{ github.event.release.tag_name }}"
          $previous = ""
          gh release list --limit 100 --json tagName --jq '.[].tagName' | ForEach-Object {
              if (-not $previous -and $_ -ne $currentTag) {
                  $previous = $_
              }
          }
          echo "value=$previous" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh

      - name: Update Version Number
        if: ${{ steps.prev_tag.outputs.value != '' }}
        run: |
          $previousTag = "${{ steps.prev_tag.outputs.value }}"
          $currentTag = "${{ github.event.release.tag_name }}"
          echo "OLD_VERSION=$previousTag" >> $env:GITHUB_ENV
          python .github/scripts/UpdateVersionNumber.py $previousTag $currentTag
        shell: pwsh

      - name: Python Install Dependencies
        working-directory: app/backend
        run: pip install -r ./requirements/iControllerCLI.txt

      - name: PyInstaller Build iController.exe
        working-directory: app/backend
        run: pyinstaller ./pyinstaller/iControllerCLI.spec

      - name: Create Zip Package
        working-directory: app/backend
        run: |
          $folderName = "icontroller-${{ github.event.release.tag_name }}-portable-win-x64-cli"
          $fileName = "iController-${{ github.event.release.tag_name }}-CLI.exe"
          Rename-Item .\dist\iController.exe $fileName
          $folderPath = ".\dist\$folderName"
          New-Item -ItemType Directory -Path $folderPath
          Move-Item -Path ".\dist\$fileName" -Destination $folderPath
          Compress-Archive -Path $folderPath -DestinationPath ".\dist\$folderName.zip"
          $artifactPath = "$env:GITHUB_WORKSPACE/app/backend/dist/$folderName.zip"
          echo "ARTIFACT_PATH=$artifactPath" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/backend/dist/icontroller-${{ github.event.release.tag_name }}-portable-win-x64-cli.zip

  build-windows-x64-gui:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.28.2'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: React Build Frontend
        working-directory: app/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.10'
          cache: 'pip'
          cache-dependency-path: |
            app/backend/requirements/iControllerCLI.txt
            app/backend/requirements/iControllerGUI.txt

      - name: Find previous release tag
        id: prev_tag
        run: |
          $currentTag = "${{ github.event.release.tag_name }}"
          $previous = ""
          gh release list --limit 100 --json tagName --jq '.[].tagName' | ForEach-Object {
              if (-not $previous -and $_ -ne $currentTag) {
                  $previous = $_
              }
          }
          echo "value=$previous" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh

      - name: Update Version Number
        if: ${{ steps.prev_tag.outputs.value != '' }}
        run: |
          $previousTag = "${{ steps.prev_tag.outputs.value }}"
          $currentTag = "${{ github.event.release.tag_name }}"
          echo "OLD_VERSION=$previousTag" >> $env:GITHUB_ENV
          python .github/scripts/UpdateVersionNumber.py $previousTag $currentTag
        shell: pwsh

      - name: Python Install Dependencies
        working-directory: app/backend
        run: pip install -r ./requirements/iControllerGUI.txt

      - name: PyInstaller Build iController.exe
        working-directory: app/backend
        run: pyinstaller ./pyinstaller/iControllerGUI.spec

      - name: Create Zip Package
        working-directory: app/backend
        run: |
          $folderName = "icontroller-${{ github.event.release.tag_name }}-portable-win-x64-gui"
          $folderPath = ".\dist\$folderName"
          Move-Item .\dist\iController $folderPath
          Compress-Archive -Path $folderPath -DestinationPath ".\dist\$folderName.zip"
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/backend/dist/icontroller-${{ github.event.release.tag_name }}-portable-win-x64-gui.zip
