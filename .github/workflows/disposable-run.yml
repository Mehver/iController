name: Disposable Run

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Which disposable task to run
        options:
          - fix-windows-logo
          - update-subheading
          - shields-to-download-list
      dry_run:
        type: boolean
        default: true
      confirm:
        type: string
        description: 'Type YES to really modify releases'
        required: true

permissions:
  contents: write

jobs:
  run:
    if: ${{ github.event.inputs.dry_run == 'true' || github.event.inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install @octokit/rest

      - run: node .github/disposable/2025-12-25-release-notes-fix-windows-logo/fix.js
        if: ${{ github.event.inputs.target == 'fix-windows-logo' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-01-03-release-notes-update-subheading/fix.js
        if: ${{ github.event.inputs.target == 'update-subheading' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - run: node .github/disposable/2026-07-27-release-notes-shields-to-download-list/fix.js
        if: ${{ github.event.inputs.target == 'shields-to-download-list' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
